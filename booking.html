<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnovaSpark Academy | لوحة التحكم والأدمن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #060a12; color: #f1f5f9; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Navbar / Header -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-2xl font-black text-orange-500">لوحة تحكم الحجوزات (Control Panel) 📊</h1>
                <p class="text-xs text-slate-400 mt-1">إدارة كافة طلبات التسجيل والحجوزات القادمة من الموقع</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-bold border border-slate-700 transition">
                    العودة للرئيسية 🏠
                </a>
                <button onclick="loadBookings()" class="bg-orange-500 hover:bg-orange-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-black transition">
                    تحديث البيانات 🔄
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-white">قائمة الحجوزات المسجلة</h2>
                <span id="bookingCount" class="bg-orange-500/10 text-orange-400 border border-orange-500/20 px-3 py-1 rounded-full text-xs font-bold">
                    عدد الحجوزات: 0
                </span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs text-slate-400 bg-slate-950/50">
                            <th class="p-3">#</th>
                            <th class="p-3">الاسم</th>
                            <th class="p-3">البريد الإلكتروني</th>
                            <th class="p-3">رقم الهاتف</th>
                            <th class="p-3">الفئة الدراسية</th>
                            <th class="p-3">الملاحظات</th>
                            <th class="p-3">تاريخ الحجز</th>
                            <th class="p-3 text-center">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTable" class="text-sm divide-y divide-slate-800">
                        <tr>
                            <td colspan="8" class="text-center py-8 text-slate-500 font-bold">جاري تحميل البيانات من قاعدة البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiH1SUJvCE4qBvZcuhqC-TPBj6ZiEByiI",
            authDomain: "innovaspark-academy-82b0e.firebaseapp.com",
            projectId: "innovaspark-academy-82b0e",
            storageBucket: "innovaspark-academy-82b0e.firebasestorage.app",
            messagingSenderId: "526950382364",
            appId: "1:526950382364:web:019593f44b5f30b0e658d9",
            measurementId: "G-C30R5TJV12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadBookings() {
            const tbody = document.getElementById('bookingsTable');
            const countBadge = document.getElementById('bookingCount');
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-500 font-bold">جاري تحميل البيانات...</td></tr>`;

            try {
                const q = query(collection(db, "bookings"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                countBadge.innerText = `عدد الحجوزات: ${querySnapshot.size}`;
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-500">لا توجد حجوزات مسجلة حتى الآن.</td></tr>`;
                    return;
                }

                let index = 1;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-800/50 transition";
                    tr.innerHTML = `
                        <td class="p-3 text-slate-400 font-mono text-xs">${index++}</td>
                        <td class="p-3 font-bold text-white">${data.name || 'غير محدد'}</td>
                        <td class="p-3 text-slate-300 font-mono text-xs">${data.email || '-'}</td>
                        <td class="p-3 text-orange-400 font-mono text-xs">${data.phone || '-'}</td>
                        <td class="p-3 text-xs text-slate-300">${data.category || '-'}</td>
                        <td class="p-3 text-xs text-slate-400">${data.notes || '-'}</td>
                        <td class="p-3 text-xs text-slate-400">${data.date || '-'}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteBooking('${docSnap.id}')" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white border border-red-500/20 px-2.5 py-1 rounded-lg text-xs transition">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("خطأ أثناء جلب الحجوزات: ", error);
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-red-400 font-bold">❌ حدث خطأ في الصلاحيات! تأكد من ضبط قواعد Rules في الفايربيز.</td></tr>`;
            }
        }

        async function deleteBooking(id) {
            if (confirm("هل أنت تأكد من حذف هذا الحجز؟")) {
                try {
                    await deleteDoc(doc(db, "bookings", id));
                    loadBookings();
                } catch (error) {
                    alert("❌ حدث خطأ أثناء الحذف");
                }
            }
        }

        window.loadBookings = loadBookings;
        window.deleteBooking = deleteBooking;

        // تحميل البيانات فور فتح الصفحة
        loadBookings();
    </script>
</body>
</html>
