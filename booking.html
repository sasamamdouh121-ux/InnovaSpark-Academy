<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>احجز الآن - نموذج الحجز</title>
    <style>
        :root {
            --primary-color: #007bff;
            --light-bg: #f8f9fa;
            --dark-text: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-text);
            line-height: 1.6;
        }

        header {
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: var(--dark-text);
            font-weight: 500;
        }

        nav a.active {
            color: var(--primary-color);
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .container h2 {
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .alert {
            display: none;
            padding: 15px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            margin-top: 15px;
            text-align: center;
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">موقعي</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="booking.html" class="active">احجز الآن</a>
        </nav>
    </header>

    <div class="container">
        <h2>نموذج تأكيد الحجز</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label for="fullName">الاسم الكامل:</label>
                <input type="text" id="fullName" required placeholder="أدخل اسمك الثلاثي">
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" required placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" required placeholder="05xxxxxxxx">
            </div>

            <div class="form-group">
                <label for="service">اختر الخدمة:</label>
                <select id="service" required>
                    <option value="">-- اختر من القائمة --</option>
                    <option value="service1">الخدمة الأولى</option>
                    <option value="service2">الخدمة الثانية</option>
                    <option value="service3">الخدمة الثالثة</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">تاريخ الحجز:</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="notes">ملاحظات إضافية (اختياري):</label>
                <textarea id="notes" rows="4" placeholder="أي تفاصيل أخرى تريد إضافتها..."></textarea>
            </div>

            <button type="submit" class="btn-submit">تأكيد الحجز</button>
        </form>

        <div id="successAlert" class="alert">
            تم إرسال طلب الحجز بنجاح! سنتواصل معك قريباً.
        </div>
    </div>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة

            // هنا يمكنك إضافة كود إرسال البيانات إلى السيرفر (AJAX / Fetch API)

            // إظهار رسالة النجاح
            const alertBox = document.getElementById('successAlert');
            alertBox.style.display = 'block';

            // تفريغ الحقول
            this.reset();
        });
    </script>

</body>
</html>
