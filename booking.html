<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnovaSpark Academy | نموذج الحجز الرئيسي</title>
    <style>
        :root {
            --primary-color: #f97316;
            --primary-hover: #ea580c;
            --bg-color: #060a12;
            --card-bg: #0f172a;
            --text-color: #f1f5f9;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #94a3b8;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a.active, nav a:hover {
            color: var(--primary-color);
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .container h2 {
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            color: #fff;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: #020617;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        .alert {
            display: none;
            padding: 15px;
            background-color: #064e3b;
            color: #6ee7b7;
            border: 1px solid #047857;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }

        footer {
            background: var(--card-bg);
            color: #94a3b8;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">InnovaSpark Academy</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="booking.html" class="active">احجز الآن (Booking)</a>
            <a href="html.html">نموذج (HTML)</a>
            <a href="admin.html">لوحة الأدمن / Control Panel 🔐</a>
        </nav>
    </header>

    <div class="container">
        <h2>نموذج تأكيد الحجز 📝</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label for="fullName">الاسم الكامل *</label>
                <input type="text" id="fullName" required placeholder="أدخل اسمك الثلاثي">
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني *</label>
                <input type="email" id="email" required placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف (واتساب) *</label>
                <input type="tel" id="phone" required placeholder="010XXXXXXXX">
            </div>

            <div class="form-group">
                <label for="service">الصفة الدراسية / الفئة *</label>
                <select id="service" required>
                    <option value="">-- اختر الفئة --</option>
                    <option value="طلاب الثانوية العامة المقبولين بهندسة">طلاب الثانوية العامة المقبولين بهندسة</option>
                    <option value="طلاب أولى هندسة / إعدادي">طلاب أولى هندسة / إعدادي</option>
                    <option value="طالب مهتم بمجالات الهندسة">أي طالب مهتم بمجالات الهندسة</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">ملاحظات إضافية (اختياري):</label>
                <textarea id="notes" rows="4" placeholder="أي تفاصيل أو استفسارات أخرى..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">تأكيد وتسجيل الحجز 🚀</button>
        </form>

        <div id="successAlert" class="alert">
            ✅ تم إرسال طلب الحجز بنجاح وحفظه في القاعدة! سنتواصل معك قريباً.
        </div>
    </div>

    <footer>
        <p>&copy; 2026 InnovaSpark Academy. جميع الحقوق محفوظة.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiH1SUJvCE4qBvZcuhqC-TPBj6ZiEByiI",
            authDomain: "innovaspark-academy-82b0e.firebaseapp.com",
            projectId: "innovaspark-academy-82b0e",
            storageBucket: "innovaspark-academy-82b0e.firebasestorage.app",
            messagingSenderId: "526950382364",
            appId: "1:526950382364:web:019593f44b5f30b0e658d9",
            measurementId: "G-C30R5TJV12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const bookingForm = document.getElementById('bookingForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('successAlert');

        bookingForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الحفظ في القاعدة...";
            alertBox.style.display = 'none';

            try {
                await addDoc(collection(db, "bookings"), {
                    name: document.getElementById('fullName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    category: document.getElementById('service').value,
                    notes: document.getElementById('notes').value.trim(),
                    date: new Date().toLocaleDateString('ar-EG'),
                    timestamp: serverTimestamp()
                });

                alertBox.style.display = 'block';
                bookingForm.reset();
            } catch (error) {
                console.error("Error writing document: ", error);
                alert("❌ حدث خطأ أثناء الحفظ! يرجى إعادة المحاولة.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد وتسجيل الحجز 🚀";
            }
        });
    </script>
</body>
</html>
