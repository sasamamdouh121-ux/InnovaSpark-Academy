<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnovaSpark Academy | نموذج الحجز والتسجيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #060a12; color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-orange-500 text-slate-950 font-black rounded-xl flex items-center justify-center text-xl">⚡</div>
                <h1 class="text-xl font-black text-white">InnovaSpark Academy</h1>
            </div>
            <nav class="flex items-center gap-4 text-sm font-semibold text-slate-400">
                <a href="index.html" class="hover:text-orange-400">الرئيسية</a>
          
                <a href="admin.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition">لوحة الأدمن / Control Panel 🔐</a>
            </nav>
        </div>
    </header>

    <!-- Form Section -->
    <main class="my-10 px-4">
        <div class="max-w-lg mx-auto bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl space-y-6">
            
            <div class="text-center space-y-2">
                <span class="bg-orange-500/10 text-orange-400 text-xs font-bold px-3 py-1 rounded-full border border-orange-500/20">حجز مقعد جديد</span>
                <h2 class="text-2xl font-black text-white">سجل بياناتك للانضمام 🚀</h2>
                <p class="text-slate-400 text-xs">احجز مكانك الآن وسنتواصل معك فوراً عبر الواتساب</p>
            </div>

            <form id="bookingForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">الاسم الكامل *</label>
                    <input type="text" id="fullName" required placeholder="أدخل اسمك الثلاثي" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">البريد الإلكتروني *</label>
                    <input type="email" id="email" required placeholder="example@mail.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition text-sm text-left dir-ltr">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">رقم الواتساب *</label>
                    <input type="tel" id="phone" required placeholder="010XXXXXXXX" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition text-sm text-left dir-ltr">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">الصفة الدراسية / الفئة *</label>
                    <select id="category" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition text-sm">
                        <option value="">-- اختر الفئة --</option>
                        <option value="طلاب الثانوية العامة المقبولين بهندسة">طلاب الثانوية العامة المقبولين بهندسة</option>
                        <option value="طلاب أولى هندسة / إعدادي">طلاب أولى هندسة / إعدادي</option>
                        <option value="طالب مهتم بمجالات الهندسة">طالب مهتم بمجالات الهندسة</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">ملاحظات أو استفسارات (اختياري)</label>
                    <textarea id="notes" rows="3" placeholder="اكتب ملاحظاتك هنا..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition text-sm"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-orange-500 hover:bg-orange-400 text-slate-950 font-black py-3.5 rounded-xl transition text-base flex items-center justify-center gap-2 shadow-lg shadow-orange-500/20">
                    <span>تأكيد وتسجيل الحجز</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>

            <div id="successAlert" class="hidden bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-4 rounded-xl text-center text-sm font-bold animate-pulse">
                ✅ تم إرسال وحفظ حجزك بنجاح! سنتواصل معك قريباً.
            </div>
            
            <div id="errorAlert" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl text-center text-xs">
                ❌ حدث خطأ أثناء الحفظ.
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        &copy; 2026 InnovaSpark Academy. جميع الحقوق محفوظة.
    </footer>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBiH1SUJvCE4qBvZcuhqC-TPBj6ZiEByiI",
            authDomain: "innovaspark-academy-82b0e.firebaseapp.com",
            projectId: "innovaspark-academy-82b0e",
            storageBucket: "innovaspark-academy-82b0e.firebasestorage.app",
            messagingSenderId: "526950382364",
            appId: "1:526950382364:web:019593f44b5f30b0e658d9",
            measurementId: "G-C30R5TJV12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const bookingForm = document.getElementById('bookingForm');
        const submitBtn = document.getElementById('submitBtn');
        const successAlert = document.getElementById('successAlert');
        const errorAlert = document.getElementById('errorAlert');

        bookingForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>جاري الحفظ...</span> <i class="fa-solid fa-spinner animate-spin"></i>`;
            successAlert.classList.add('hidden');
            errorAlert.classList.add('hidden');

            try {
                await addDoc(collection(db, "bookings"), {
                    name: document.getElementById('fullName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    category: document.getElementById('category').value,
                    notes: document.getElementById('notes').value.trim(),
                    date: new Date().toLocaleDateString('ar-EG'),
                    timestamp: serverTimestamp()
                });

                successAlert.classList.remove('hidden');
                bookingForm.reset();
            } catch (error) {
                console.error("Firebase Error:", error);
                errorAlert.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>تأكيد وتسجيل الحجز</span> <i class="fa-solid fa-paper-plane"></i>`;
            }
        });
    </script>
</body>
</html>
