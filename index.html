<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول / إنشاء حساب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .toggle-link {
            margin-top: 15px;
            display: block;
            color: #007bff;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="form-title">تسجيل الدخول</h2>
    
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="password" id="password" placeholder="كلمة المرور" required>
    
    <button id="auth-btn">تسجيل الدخول</button>
    
    <span class="toggle-link" id="toggle-btn">ليس لديك حساب؟ إنشاء حساب جديد</span>
    <p id="message"></p>
</div>

<!-- استدعاء مكتبات Firebase الحديثة (Module Import) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // 🔴 ضع إعدادات مشروع الفايربيز الجديد الخاص بك هنا 🔴
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // تهيئة الفايربيز
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // عناصر الصفحة
  const formTitle = document.getElementById('form-title');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const authBtn = document.getElementById('auth-btn');
  const toggleBtn = document.getElementById('toggle-btn');
  const message = document.getElementById('message');

  let isSignUp = false; // التبديل بين الدخول وإنشاء حساب

  // التبديل بين وضع التسجيل والدخول
  toggleBtn.addEventListener('click', () => {
    isSignUp = !isSignUp;
    if (isSignUp) {
      formTitle.textContent = "إنشاء حساب جديد";
      authBtn.textContent = "إنشاء حساب";
      toggleBtn.textContent = "لديك حساب بالفعل؟ تسجيل الدخول";
    } else {
      formTitle.textContent = "تسجيل الدخول";
      authBtn.textContent = "تسجيل الدخول";
      toggleBtn.textContent = "ليس لديك حساب؟ إنشاء حساب جديد";
    }
    message.textContent = "";
  });

  // زر الإرسال (الدخول / التسجيل)
  authBtn.addEventListener('click', () => {
    const email = emailInput.value;
    const password = passwordInput.value;

    if(!email || !password) {
      message.style.color = "red";
      message.textContent = "يرجى إدخال البريد وكلمة المرور";
      return;
    }

    if (isSignUp) {
      // إنشاء حساب جديد
      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          message.style.color = "green";
          message.textContent = "تم إنشاء الحساب بنجاح!";
        })
        .catch((error) => {
          message.style.color = "red";
          message.textContent = "خطأ: " + error.message;
        });
    } else {
      // تسجيل الدخول
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          message.style.color = "green";
          message.textContent = "تم تسجيل الدخول بنجاح!";
          // يمكنك إعادة التوجيه لصفحة أخرى هنا مثلاً:
          // window.location.href = "home.html";
        })
        .catch((error) => {
          message.style.color = "red";
          message.textContent = "خطأ في البريد أو كلمة المرور";
        });
    }
  });
</script>

</body>
</html>
